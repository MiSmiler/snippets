<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snippets</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="tabbar" hidden></div>
      <div id="main">
        <div id="editor"></div>
        <div id="empty" hidden></div>
      </div>
      <div id="settings" hidden>
        <div class="settings-title">Settings</div>
        <div class="settings-row">
          <span class="settings-label">Zoom</span>
          <button id="scale-minus" title="Zoom out (Ctrl+-)">−</button>
          <span id="scale-value">100%</span>
          <button id="scale-plus" title="Zoom in (Ctrl+=)">+</button>
          <button id="scale-reset" title="Reset to 100% (Ctrl+0)">Reset</button>
        </div>
        <div class="settings-row">
          <span class="settings-label">Font size</span>
          <button id="font-minus" title="Decrease font size">−</button>
          <span id="font-size-value">16</span>
          <button id="font-plus" title="Increase font size">+</button>
          <button id="font-reset" title="Reset font size">Reset</button>
        </div>
        <div class="settings-row">
          <span class="settings-label">Theme</span>
          <select id="theme-select">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="system">System</option>
          </select>
        </div>
        <div class="settings-row">
          <span class="settings-label">Word movement</span>
          <select id="word-seg-select">
            <option value="jieba-standard">jieba · Standard</option>
            <option value="jieba-fine">jieba · Fine</option>
            <option value="system">System default</option>
          </select>
        </div>
        <div class="settings-row">
          <span class="settings-label">Line numbers</span>
          <input id="line-numbers-toggle" type="checkbox" />
        </div>
      </div>
      <div id="palette" hidden>
        <input
          id="palette-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Open a note..."
        />
        <div id="palette-list"></div>
      </div>
      <div id="confirm" hidden>
        <div class="confirm-card">
          <div id="confirm-message"></div>
          <div id="confirm-actions" class="dialog-actions"></div>
        </div>
      </div>
      <div id="tabmenu" hidden>
        <button id="tabmenu-rename">Rename…</button>
      </div>
      <div id="rename" hidden>
        <div class="confirm-card">
          <div class="dialog-title">Rename note</div>
          <input
            id="rename-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="note name"
          />
          <div id="rename-error" class="rename-error" hidden></div>
          <div class="dialog-actions">
            <button id="rename-ok">Rename</button>
            <button id="rename-cancel">Cancel</button>
          </div>
        </div>
      </div>
      <div id="toast" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
