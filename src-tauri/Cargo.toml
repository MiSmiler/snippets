[package]
name = "snippets"
version = "0.1.0"
description = "A minimal markdown notepad"
edition = "2021"

[lib]
name = "snippets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Chinese word segmentation for word navigation. The `default-dict` feature
# (enabled by default) embeds the dictionary in the binary, keeping the app a
# single portable exe with no extra data files.
jieba-rs = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
